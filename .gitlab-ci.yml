stages:
- test
- build
- deploy

variables:
  AUTO_DEVOPS_BUILD_IMAGE_FORWARDED_CI_VARIABLES: CI_COMMIT_SHA,CI_ENVIRONMENT_NAME,CI_ENVIRONMENT_SLUG

# Include AutoDevops build
include:
- local: .ci/jobs/build.gitlab-ci.yml

# Unit tests. These run in a plain Python image rather than the Orthanc container: the Orthanc SDK
# and the Sonador imaging stack are stubbed by tests/conftest.py, so the suite needs only pytest.
pytest:
  stage: test
  image: python:3.12-slim
  script:
  - pip install --no-cache-dir -r requirements-dev.txt
  - python -m pytest -q
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: $CI_MERGE_REQUEST_IID
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Build containers for master and review
docker-build:
  extends: .ci:stage:build
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'

docker-review:
  extends: .ci:stage:build
  rules:
  - if: $CI_MERGE_REQUEST_IID
  - if: $CI_COMMIT_TAG
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker-gcp-build:
  extends: .ci:stage:build
  variables: 
    DOCKERFILE_PATH: "Dockerfile.gcp"
    CI_APPLICATION_TAG: "orthanc-sonador-gcp"
    DOCKER_TLS_CERTDIR: ""
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - docker build -f Dockerfile.gcp -t orthanc-sonador-gcp .
    - docker tag orthanc-sonador-gcp:latest $CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/orthanc-sonador:gcp
    - echo "$DOCKER_PUBLISH_PASSWORD" | docker login -u "$DOCKER_PUBLISH_USER" --password-stdin "$CI_REGISTRY"
    - docker push $CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/orthanc-sonador:gcp
    - echo "$DOCKER_HUB_SERVICE_PASSWORD" | docker login -u "$DOCKER_HUB_SERVICE_USER" --password-stdin
    - docker tag $CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/orthanc-sonador:gcp oaktreetech/orthanc-sonador:gcp
    - docker push oaktreetech/orthanc-sonador:gcp


# Publish Docker Image to Imaging Environment Registry
publish-oaktree:
  stage: deploy
  image: docker:19.03.8
  services:
  - docker:19.03.8-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  
  only:
    refs:
    - master
    variables:
    - $DOCKER_PUBLISH_PASSWORD
    - $DOCKER_PUBLISH_USER
  
  script:
  - echo "$DOCKER_PUBLISH_PASSWORD" | docker login -u "$DOCKER_PUBLISH_USER" --password-stdin "$CI_REGISTRY"
  - docker pull $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA
  - docker tag $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA $CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/orthanc-sonador:latest
  - docker push $CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/orthanc-sonador:latest


publish-docker:
  stage: deploy
  image: docker:19.03.8
  services:
  - docker:19.03.8-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  
  only:
    refs:
    - master
    variables:
    - $DOCKER_HUB_SERVICE_PASSWORD
    - $DOCKER_HUB_SERVICE_USER
  
  script:
  - echo "$DOCKER_HUB_SERVICE_PASSWORD" | docker login -u "$DOCKER_HUB_SERVICE_USER" --password-stdin
  - docker pull $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA
  - docker tag $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA oaktreetech/orthanc-sonador:latest
  - docker push oaktreetech/orthanc-sonador:latest
